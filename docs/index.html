<!doctype html>
<html lang="en">
  <head>
    <title>CineSeat API — Interactive Reference</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="https://fav.farm/🍿" />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: './openapi.json',
        theme: 'purple',
        layout: 'modern',
        showSidebar: true,
        darkMode: true,
        metaData: {
          title: 'CineSeat Cinema Seating & Showtimes Intelligence API',
          description: 'Production-grade RESTful API for cinema metadata, real-time showtimes, seat-level layouts, and SMPTE/THX acoustic-optical seat recommendation engine.'
        }
      })
    </script>
  </body>
</html>
