<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineSeat API Editorial Minimalist Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: '#0157de',
          'brand-dark': '#011c51',
          'brand-post': '#031d4e',
        },
        fontFamily: {
          sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          display: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'sans-serif'],
        }
      }
    }
  }
</script>
<style>
  body, html {
    margin: 0;
    padding: 0;
    background-color: #080a10;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Exact 1080x1350 Poster Canvas */
  .poster-canvas {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: #0157de;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7);
  }

  /* Isometric / 3D Billboard construction */
  .sign-assembly {
    position: relative;
    width: 480px;
    height: 480px;
    margin: 0 auto;
    perspective: 1200px;
  }

  .sign-post {
    position: absolute;
    bottom: -150px;
    left: 50%;
    transform: translateX(-50%);
    width: 24px;
    height: 340px;
    background: linear-gradient(90deg, #011438 0%, #031d4e 60%, #011438 100%);
    border-radius: 4px;
    z-index: 5;
    box-shadow: 10px 18px 30px rgba(0, 15, 50, 0.4);
  }

  .sign-post-bracket {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 18px;
    background: #011438;
    border-radius: 3px;
  }

  /* 3D Extrusion Cuboid */
  .sign-box {
    position: relative;
    width: 360px;
    height: 360px;
    margin: 20px auto 0 auto;
    z-index: 10;
    transform: rotateX(8deg) rotateY(-14deg) rotateZ(1.5deg);
    transform-style: preserve-3d;
  }

  /* Main front face */
  .sign-front {
    position: absolute;
    inset: 0;
    background: #ffffff;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transform: translateZ(32px);
    box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.9);
  }

  /* Extrusion sides created via pseudo / borders */
  .sign-depth-top {
    position: absolute;
    top: -28px;
    left: 10px;
    width: 346px;
    height: 32px;
    background: #01246b;
    transform-origin: bottom center;
    transform: rotateX(75deg);
    border-radius: 12px 12px 0 0;
  }

  .sign-depth-left {
    position: absolute;
    top: 6px;
    left: -28px;
    width: 32px;
    height: 346px;
    background: #011438;
    transform-origin: right center;
    transform: rotateY(-75deg);
    border-radius: 12px 0 0 12px;
  }

  /* Ambient realistic drop shadow below the floating sign */
  .sign-ground-shadow {
    position: absolute;
    bottom: -70px;
    left: 50%;
    transform: translateX(-50%) rotateX(75deg);
    width: 380px;
    height: 140px;
    background: radial-gradient(ellipse at center, rgba(1, 15, 55, 0.55) 0%, rgba(1, 15, 55, 0.15) 55%, transparent 75%);
    filter: blur(14px);
    z-index: 4;
  }

  /* Swiss typography tracking */
  .tracking-widest-pro {
    letter-spacing: 0.38em;
  }

  .leading-tight-custom {
    line-height: 1.05;
  }
</style>
</head>
<body>

  <!-- 1080x1350 Poster Frame -->
  <div class="poster-canvas p-[96px] text-white selection:bg-white selection:text-[#0157de]">
    
    <!-- Top Section: Header & Editorial Title -->
    <header class="w-full flex flex-col items-start z-20">
      <!-- Spaced-out uppercase label -->
      <div class="font-display text-[15px] font-bold text-white/90 uppercase tracking-widest-pro mb-8 flex items-center gap-3">
        <span>C&nbsp;&nbsp;I&nbsp;&nbsp;N&nbsp;&nbsp;E&nbsp;&nbsp;S&nbsp;&nbsp;E&nbsp;&nbsp;A&nbsp;&nbsp;T&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;A&nbsp;&nbsp;P&nbsp;&nbsp;I</span>
      </div>

      <!-- Main Headline: Large, elegant, crisp modern Swiss sans -->
      <h1 class="text-[76px] font-semibold text-white tracking-[-0.035em] leading-tight-custom max-w-[750px]">
        The API for<br>
        All Movie Needs
      </h1>
    </header>

    <!-- Center Section: 3D Minimalist Cinema Billboard on Post -->
    <div class="w-full flex-1 flex flex-col justify-center items-center relative my-[-20px] z-10">
      
      <div class="sign-assembly">
        <!-- Post structure rooted beneath -->
        <div class="sign-post">
          <div class="sign-post-bracket"></div>
        </div>

        <!-- Ground / cast ambient shadow -->
        <div class="sign-ground-shadow"></div>

        <!-- 3D Extruded Signboard -->
        <div class="sign-box">
          <!-- Top 3D Extrusion Lip -->
          <div class="sign-depth-top"></div>
          <!-- Left 3D Extrusion Lip -->
          <div class="sign-depth-left"></div>

          <!-- Front Crisp White Face -->
          <div class="sign-front px-10 py-10">
            <!-- Typographic Avant-Garde Cinema Logo -->
            <div class="flex flex-col items-center justify-center text-center select-none">
              <!-- Top line: CINE. -->
              <div class="text-[64px] font-black tracking-[-0.04em] text-[#0157de] leading-[0.88] uppercase">
                CINE<span class="text-[#0157de] opacity-80">.</span>
              </div>
              <!-- Bottom line: SEAT -->
              <div class="text-[64px] font-black tracking-[0.06em] text-[#0157de] leading-[0.88] uppercase mt-2">
                SEAT
              </div>

              <!-- Subtle graphic micro-accent -->
              <div class="w-10 h-[3px] bg-[#0157de] rounded-full mt-6 opacity-40"></div>
            </div>
          </div>
        </div>

      </div>

    </div>

    <!-- Bottom Section: Minimalist Subtext URL & Repo -->
    <footer class="w-full flex justify-between items-end z-20 pt-6">
      <div class="font-sans text-[15px] font-medium tracking-[0.04em] text-white/80">
        cineseat-api.antideploy.app &nbsp;·&nbsp; github.com/agnelfranciso/cineseat-api
      </div>
      <div class="text-[13px] font-mono tracking-wider text-white/50 uppercase">
        4:5 &nbsp;|&nbsp; 1080×1350 PX
      </div>
    </footer>

  </div>

</body>
</html>
